services:
  postgres:
    image: postgres:16-alpine
    container_name: card-db-postgres
    environment:
      POSTGRES_DB: card_management_db
      POSTGRES_USER: card_user
      POSTGRES_PASSWORD: card_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card_user -d card_management_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - card-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: card-db-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - card-network

  # ✅ AGREGAR ESTE SERVICIO
  flyway:
    image: flyway/flyway:11.1.0-alpine
    container_name: card-db-flyway
    command: migrate
    volumes:
      - ./migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/card_management_db
      FLYWAY_USER: card_user
      FLYWAY_PASSWORD: card_pass
      FLYWAY_SCHEMAS: public
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - card-network

networks:
  card-network:
    driver: bridge

volumes:
  postgres_data:
